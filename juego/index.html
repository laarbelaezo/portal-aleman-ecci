// Utilidades: mezcla uniforme (Fisher-Yates) y opciones barajadas
function barajar(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
}
function prepararPregunta(q) {
    const letras = ['a', 'b', 'c'];
    const correcta = q.o[letras.indexOf(q.a)];
    const opciones = barajar(q.o);
    return { ...q, o: opciones, a: letras[opciones.indexOf(correcta)] };
}

// Clases del juego
class Jugador {
    constructor(x, y, img) {
        this.x = x;
        this.y = y;
        this.ancho = 40;
        this.alto = 60;
        this.velY = 0;
        this.gravedad = 0.8;
        this.enSuelo = false;
        this.gameOver = false;
        this.img = img;
    }

    update(plataformas, teclas) {
        if (teclas['ArrowLeft']) this.x -= 7;
        if (teclas['ArrowRight']) this.x += 7;
        if (teclas['ArrowUp'] && this.enSuelo) {
            this.velY = -18;
            sonidos.jump.currentTime = 0;
            sonidos.jump.play().catch(() => {});
        }

        this.velY += this.gravedad;
        this.y += this.velY;
        this.enSuelo = false;

        for (let p of plataformas) {
            if (this.x < p.x + p.ancho && this.x + this.ancho > p.x &&
                this.y < p.y + p.alto && this.y + this.alto > p.y) {
                if (this.velY > 0) {
                    this.y = p.y - this.alto;
                    this.velY = 0;
                    this.enSuelo = true;
                }
            }
        }
        if (this.y > 600) this.gameOver = true;
    }

    draw(camaraX) {
        if (this.img) {
            ctx.drawImage(this.img, this.x - camaraX, this.y, this.ancho, this.alto);
        } else {
            ctx.fillStyle = 'red';
            ctx.fillRect(this.x - camaraX, this.y, this.ancho, this.alto);
        }
    }
}

class Plataforma {
    constructor(x, y, ancho, alto, img) {
        this.x = x; this.y = y; this.ancho = ancho; this.alto = alto; this.img = img;
    }
    draw(camaraX) {
        if (this.img.complete && this.img.naturalWidth !== 0) {
            ctx.drawImage(this.img, this.x - camaraX, this.y, this.ancho, this.alto);
        } else {
            ctx.fillStyle = '#8B4513';
            ctx.fillRect(this.x - camaraX, this.y, this.ancho, this.alto);
        }
    }
}

class Moneda {
    constructor(x, y) {
        this.x = x; this.y = y; this.ancho = 40; this.alto = 40;
    }
    draw(camaraX) {
        if (imgs.moneda.complete && imgs.moneda.naturalWidth !== 0) {
            ctx.drawImage(imgs.moneda, this.x - camaraX, this.y, this.ancho, this.alto);
        } else {
            ctx.fillStyle = '#FFD700';
            ctx.fillRect(this.x - camaraX, this.y, this.ancho, this.alto);
        }
    }
}

    // Evita que flechas y espacio desplacen la página
    if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
    teclas[e.code] = true;
    if (e.repeat) return; // ignora teclas mantenidas
    if (e.key.length === 1) tecladoBuffer = (tecladoBuffer + e.key).slice(-30);
    // Modo profesor (código secreto para pruebas): gana la partida al instante
    if (tecladoBuffer.toLowerCase().includes("merequetengue")) {
        esCampeon = true;
    }
    manejadorTeclas(e.key, e.code);
});

window.addEventListener('keyup', (e) => {
    teclas[e.code] = false;
});

function reiniciarJuego(imgData, filtro) {
    plataformas = [new Plataforma(0, 500, 1000, 50, imgs.piso)];
    monedas = [];
    ultimaPlataformaX = 1000;
    contadorPlataformas = 0;
    score = 0;
    vidas = 3;
    indiceQuiz = 0;
    esCampeon = false;
    pausado = false;
    estadoQuiz = false;
    estadoExplicacion = false;
    sonidoGoDisparado = false;
    sonidoWinDisparado = false;
    tecladoBuffer = "";
    ultimoError = null;

    detenerMusica();

    let subbanco = filtro === "ALL" ? bancoPreguntas : bancoPreguntas.filter(q => q.k === filtro);
    if (subbanco.length === 0) subbanco = bancoPreguntas;
    listaQuiz = barajar(subbanco).slice(0, 10).map(prepararPregunta);

    jugador = new Jugador(100, 100, imgData);
    camaraX = 0;
}

async function activarCamara() {
    try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: true });
        video.srcObject = stream;
        capturandoFoto = true;
        errorCamara = false;
    } catch (err) {
        errorCamara = true;
        capturandoFoto = false;
    }
}

function detenerCamara() {
    if (video.srcObject) {
        video.srcObject.getTracks().forEach(track => track.stop());
        video.srcObject = null;
    }
    capturandoFoto = false;
}

function capturarFrame() {
    const vw = video.videoWidth, vh = video.videoHeight;
    if (!vw || !vh) { detenerCamara(); return null; }
    // Recorte vertical centrado (proporción 2:3) para no deformar la cara
    const sh = vh;
    const sw = vh * 2 / 3;
    const sx = (vw - sw) / 2;
    const canvasTemp = document.createElement('canvas');
    canvasTemp.width = 80;
    canvasTemp.height = 120;
    const ctxTemp = canvasTemp.getContext('2d');
    ctxTemp.drawImage(video, sx, 0, sw, sh, 0, 0, 80, 120);
    const imgSnap = new Image();
    imgSnap.src = canvasTemp.toDataURL();
    detenerCamara();
    return imgSnap;
}

function manejadorTeclas(key, code) {
    if (estado === "MENU_INICIAL") {
        if (key.toLowerCase() === 'k') {
            if (!capturandoFoto) activarCamara();
        } else if (key.toLowerCase() === 's') {
            detenerCamara();
            imgJugadorActual = imgs.jugadorStd;
            estado = "SELECCION_NIVEL";
        } else if (code === 'Space' && capturandoFoto) {
            imgJugadorActual = capturarFrame() || imgs.jugadorStd;
            estado = "SELECCION_NIVEL";
        }
    } else if (estado === "SELECCION_NIVEL") {
        if (key === '1') { filtroKasus = "Nom"; estado = "HISTORIA"; }
        if (key === '2') { filtroKasus = "Akk"; estado = "HISTORIA"; }
        if (key === '3') { filtroKasus = "Dat"; estado = "HISTORIA"; }
        if (key === '4') { filtroKasus = "ALL"; estado = "HISTORIA"; }
    } else if (estado === "HISTORIA") {
        if (code === 'Space') {
            reiniciarJuego(imgJugadorActual, filtroKasus);
            estado = "JUGANDO";
            iniciarMusica();
        }
    } else if (estado === "JUGANDO") {
        if (estadoExplicacion) {
            if (code === 'Enter' || code === 'Space') {
                estadoExplicacion = false;
                indiceQuiz++;
                if (vidas <= 0) {
                    jugador.gameOver = true;
                    detenerMusica();
                } else if (indiceQuiz >= listaQuiz.length) {
                    esCampeon = true;
                    detenerMusica();
                } else {
                    musicaFondo.play().catch(() => {});
                }
            }
        } else if (estadoQuiz) {
            let sel = null;
            if (key.toLowerCase() === 'a') sel = "a";
            if (key.toLowerCase() === 'b') sel = "b";
            if (key.toLowerCase() === 'c') sel = "c";

            if (sel) {
                let qActual = listaQuiz[indiceQuiz];
                if (sel === qActual.a) {
                    score++;
                    indiceQuiz++;
                    if (indiceQuiz >= listaQuiz.length) {
                        esCampeon = true;
                        detenerMusica();
                    } else {
                        musicaFondo.play().catch(() => {});
                    }
                } else {
                    vidas--;
                    let idxSel = sel === "a" ? 0 : (sel === "b" ? 1 : 2);
                    let idxCorr = qActual.a === "a" ? 0 : (qActual.a === "b" ? 1 : 2);
                    ultimoError = {
                        q: qActual.q,
                        tuAns: qActual.o[idxSel],
                        corrAns: qActual.o[idxCorr],
                        regla: qActual.r
                    };
                    estadoExplicacion = true;
                }
                estadoQuiz = false;
            }
        } else if (jugador.gameOver || esCampeon) {
            if (key.toLowerCase() === 'r') {
                detenerMusica();
                estado = "MENU_INICIAL";
            }
        } else {
            if (code === 'Enter') {
                pausado = !pausado;
                if (pausado) pausarMusica();
                else musicaFondo.play().catch(() => {});
            } else if (pausado) {
                if (key.toLowerCase() === 'w') {
                    pausado = false;
                    musicaFondo.play().catch(() => {});
                }
                if (key.toLowerCase() === 'r') {
                    detenerMusica();
                    estado = "MENU_INICIAL";
                }
            }
        }
    }
}

// Lógica del juego (se ejecuta a 60 pasos por segundo, sin importar la pantalla)
function actualizarJuego() {
        if (!pausado && !jugador.gameOver && !estadoQuiz && !estadoExplicacion && !esCampeon) {
            jugador.update(plataformas, teclas);

            if (jugador.gameOver) {
                detenerMusica();
                if (!sonidoGoDisparado) {
                    sonidos.gameover.play().catch(() => {});
                    sonidoGoDisparado = true;
                }
            }

            if (ultimaPlataformaX < jugador.x + 1000) {
                let pAncho = Math.floor(Math.random() * 100) + 80;
                let pX = ultimaPlataformaX + Math.floor(Math.random() * 120) + 80;
                let pY = Math.floor(Math.random() * 150) + 300;
                plataformas.push(new Plataforma(pX, pY, pAncho, 20, imgs.bloque));
                contadorPlataformas++;
                if (contadorPlataformas % 5 === 0 && indiceQuiz < listaQuiz.length) {
                    monedas.push(new Moneda(pX + pAncho / 2 - 20, 300));
                }
                ultimaPlataformaX = pX + pAncho;
            }

            for (let i = monedas.length - 1; i >= 0; i--) {
                let m = monedas[i];
                if (jugador.x < m.x + m.ancho && jugador.x + jugador.ancho > m.x &&
                    jugador.y < m.y + m.alto && jugador.y + jugador.alto > m.y) {
                    monedas.splice(i, 1);
                    estadoQuiz = true;
                    pausarMusica();
                }
            }

            if (jugador.x > ANCHO / 2) {
                camaraX = jugador.x - ANCHO / 2;
            }
        }
}

// Loop Principal
const PASO = 1000 / 60;
let ultimoTiempo = performance.now();
let acumulador = 0;

function gameLoop(ahora) {
    acumulador += Math.min(ahora - ultimoTiempo, 250);
    ultimoTiempo = ahora;
    while (acumulador >= PASO) {
        if (estado === "JUGANDO") actualizarJuego();
        acumulador -= PASO;
    }

    ctx.clearRect(0, 0, ANCHO, ALTO);

    if (estado === "MENU_INICIAL") {
        ctx.fillStyle = "black";
        ctx.fillRect(0, 0, ANCHO, ALTO);

        if (capturandoFoto) {
            ctx.drawImage(video, 280, 50, 400, 400);
            ctx.fillStyle = "white";
            ctx.font = "24px Arial";
            ctx.fillText("[LEERTASTE] zum Foto!", 360, 480);
        } else {
            ctx.fillStyle = "white";
            ctx.font = "bold 50px Arial";
            ctx.fillText("DEKLINATIONSSPIEL", 200, 100);
            ctx.font = "22px Arial";
            ctx.fillText("Drücke [K] für Kamera-Foto oder [S] für Standard-Sprite", 200, 220);
            ctx.fillText("Steuerung: Pfeiltasten (← → bewegen, ↑ springen)", 200, 280);
            ctx.fillText("Antworten im Quiz: Tasten [A], [B] oder [C]", 200, 340);
            if (errorCamara) {
                ctx.fillStyle = "red";
                ctx.fillText("Kamera nicht gefunden! Bitte [S] drücken.", 250, 420);
            }
        }
    } 
    else if (estado === "SELECCION_NIVEL") {
        ctx.fillStyle = "#141E32";
        ctx.fillRect(0, 0, ANCHO, ALTO);
        ctx.fillStyle = "#FFD700";
        ctx.font = "bold 50px Arial";
        ctx.fillText("WÄHLE DAS LEVEL", 240, 100);
        ctx.fillStyle = "white";
        ctx.font = "24px Arial";
        ctx.fillText("[1] Welt 1: Nominativ", 320, 220);
        ctx.fillText("[2] Welt 2: Akkusativ", 320, 280);
        ctx.fillText("[3] Welt 3: Dativ", 320, 340);
        ctx.fillText("[4] Welt 4: Alle Fälle (Meister)", 320, 400);
    } 
    else if (estado === "HISTORIA") {
        ctx.fillStyle = "#0A0A1E";
        ctx.fillRect(0, 0, ANCHO, ALTO);
        ctx.fillStyle = "#FFD700";
        ctx.font = "bold 32px Arial";
        ctx.fillText("¡DER ENDUNGS-DIEB HAT ZUGESCHLAGEN!", 150, 100);
        ctx.fillStyle = "white";
        ctx.font = "20px Arial";
        ctx.fillText("Der fiese Endungs-Dieb hat alle Adjektivendungen gestohlen.", 200, 180);
        ctx.fillText("Ohne sie versinkt die deutsche Sprache im Chaos!", 220, 220);
        ctx.fillText("Deine Mission: Laufe durch die Welten, sammle die Fragen", 200, 300);
        ctx.fillText("und erobere die richtigen Endungen zurück.", 260, 340);
        ctx.fillStyle = "#FFD700";
        ctx.fillText("Drücke [LEERTASTE], um das Abenteuer zu starten!", 220, 440);
    } 
    else if (estado === "JUGANDO") {
        // Renderizado
        if (imgs.fondo.complete && imgs.fondo.naturalWidth !== 0) {
            ctx.drawImage(imgs.fondo, 0, 0, ANCHO, ALTO);
        } else {
            ctx.fillStyle = "#87CEEB";
            ctx.fillRect(0, 0, ANCHO, ALTO);
        }

        plataformas.forEach(p => p.draw(camaraX));
        monedas.forEach(m => m.draw(camaraX));
        jugador.draw(camaraX);

        ctx.fillStyle = "white";
        ctx.font = "24px Arial";
        ctx.fillText(`Punkte: ${score}/${listaQuiz.length}`, 780, 40);
        ctx.fillStyle = "#FF6B6B";
        ctx.fillText(`Leben: ${vidas > 0 ? "❤️ ".repeat(vidas) : "❌"}`, 40, 40);

        if (esCampeon) {
            detenerMusica();
            if (!sonidoWinDisparado) {
                sonidos.win.play().catch(() => {});
                sonidoWinDisparado = true;
            }
            ctx.fillStyle = "rgba(255, 215, 0, 0.8)";
            ctx.fillRect(0, 0, ANCHO, ALTO);
            ctx.fillStyle = "white";
            ctx.font = "bold 60px Arial";
            ctx.fillText("CHAMPION!", 300, 200);
            ctx.font = "24px Arial";
            ctx.fillText("[R]estart", 420, 380);
        } 
        else if (jugador.gameOver) {
            detenerMusica();
            if (!sonidoGoDisparado) {
                sonidos.gameover.play().catch(() => {});
                sonidoGoDisparado = true;
            }
            ctx.fillStyle = "rgba(150, 0, 0, 0.8)";
            ctx.fillRect(0, 0, ANCHO, ALTO);
            ctx.fillStyle = "white";
            ctx.font = "bold 60px Arial";
            ctx.fillText("GAME OVER", 280, 200);
            ctx.font = "24px Arial";
            ctx.fillText(`Punkte: ${score}/${listaQuiz.length}`, 410, 280);
            ctx.fillText("[R]estart", 420, 380);
        } 
        else if (estadoExplicacion && ultimoError) {
            ctx.fillStyle = "rgba(40, 0, 0, 0.9)";
            ctx.fillRect(0, 0, ANCHO, ALTO);
            ctx.fillStyle = "#FF5050";
            ctx.font = "bold 50px Arial";
            ctx.fillText("FALSCH!", 380, 80);
            ctx.fillStyle = "white";
            ctx.font = "22px Arial";
            ctx.fillText(`Frage: ${ultimoError.q}`, 100, 160);
            ctx.fillStyle = "#FF8080";
            ctx.fillText(`Deine Antwort: ${ultimoError.tuAns}`, 100, 210);
            ctx.fillStyle = "#80FF80";
            ctx.fillText(`Richtig war: ${ultimoError.corrAns}`, 100, 250);

            ctx.fillStyle = "rgba(20, 60, 20, 0.9)";
            ctx.fillRect(80, 300, 800, 100);
            ctx.strokeStyle = "#00FF00";
            ctx.strokeRect(80, 300, 800, 100);
            ctx.fillStyle = "#FFD700";
            ctx.fillText("GRAMMATIK-REGEL:", 100, 335);
            ctx.fillStyle = "white";
            ctx.fillText(ultimoError.regla, 100, 370);

            ctx.fillStyle = "#CCCCCC";
            ctx.font = "18px Arial";
            ctx.fillText("Drücke [ENTER] oder [LEERTASTE], um fortzufahren...", 260, 460);
        } 
        else if (estadoQuiz) {
            ctx.fillStyle = "rgba(0, 50, 80, 0.9)";
            ctx.fillRect(0, 0, ANCHO, ALTO);
            let q = listaQuiz[indiceQuiz];
            ctx.fillStyle = "white";
            ctx.font = "24px Arial";
            ctx.fillText(q.q, 100, 160);
            ctx.fillText(`a) ${q.o[0]}`, 100, 230);
            ctx.fillText(`b) ${q.o[1]}`, 100, 280);
            ctx.fillText(`c) ${q.o[2]}`, 100, 330);
        } 
        else if (pausado) {
            ctx.fillStyle = "white";
            ctx.font = "28px Arial";
            ctx.fillText("PAUSE - [W]eiter, [R]estart", 300, 270);
        }
    }

    requestAnimationFrame(gameLoop);
}

requestAnimationFrame(gameLoop);
</script>
